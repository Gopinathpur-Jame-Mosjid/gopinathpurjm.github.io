<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR পোস্টার</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@600;700&family=Hind+Siliguri:wght@400;600&display=swap');
body{margin:0;background:#e9eee9;font-family:'Hind Siliguri',sans-serif}.bar{padding:14px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;background:#fff}.bar input{width:min(460px,90vw);padding:10px;border:1px solid #ccd;border-radius:10px;font-size:14px}.bar button{padding:10px 18px;border:0;border-radius:10px;background:#0b6a51;color:#fff;font-weight:600;cursor:pointer}
.poster{width:210mm;min-height:297mm;margin:16px auto;background:#062f27;color:#fff;text-align:center;padding:22mm 16mm;box-sizing:border-box;border:3mm double #c9a24b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8mm}
.poster .m{font-size:60px;color:#c9a24b}.poster h1{font:700 44px 'Noto Serif Bengali',serif;margin:0}.poster p{margin:0;font-size:22px;color:#d6eadf}.qr{background:#fff;padding:9mm;border-radius:8mm;width:110mm}.qr svg{width:100%;height:auto;display:block}.poster .u{font-size:15px;color:#c9a24b;word-break:break-all}
@media print{.bar{display:none}body{background:#fff}.poster{margin:0;width:100%;min-height:100vh;border-width:3mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}@page{size:A4;margin:0}html,body{height:100%;margin:0}.poster{height:100vh;min-height:0;padding:10mm;gap:5mm;overflow:hidden;break-inside:avoid;page-break-after:avoid;border-width:2mm}.poster h1{font-size:34px}.poster p{font-size:17px}.poster .m{font-size:44px}.qr{width:min(92mm,50vh);padding:6mm}}@media print{html,body{height:auto!important}#p2{break-before:page;page-break-before:always}.poster{break-after:auto}}</style></head><body>
<div class="bar"><input id="u" placeholder="অ্যাপের লিংক"><button id="g">QR তৈরি করুন</button><button onclick="print()">প্রিন্ট করুন</button></div>
<div class="bar" style="padding-top:0"><input id="u2" placeholder="ইফতার অ্যাপের লিংক"><label style="display:flex;align-items:center;gap:6px;font-size:14px"><input type="checkbox" id="c2" checked style="width:auto"> ইফতার পোস্টারও যোগ করুন</label></div>
<div class="poster"><div class="m">☾</div><h1>গোপীনাথপুর জামে মসজিদ</h1><p>স্ক্যান করে নামাজের সময়, ঘোষণা, আয়-ব্যয়ের হিসাব ও আগের বছরের খাতা দেখুন</p><div class="qr" id="q"></div><p>ফোনের ক্যামেরা QR কোডে ধরুন</p><div class="u" id="t"></div></div>
<div class="poster" id="p2"><div class="m">☾</div><h1>ইফতার ফান্ড</h1><p>স্ক্যান করে আজকের ইফতারদাতা, ইফতার বুকিং ও দান করুন</p><div class="qr" id="q2"></div><p>ফোনের ক্যামেরা QR কোডে ধরুন</p><div class="u" id="t2"></div></div>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script>const u=document.getElementById('u'),u2=document.getElementById('u2'),c2=document.getElementById('c2'),p2=document.getElementById('p2');u.value=location.href.replace(/qr\.html.*$/,'');u2.value='https://gopinathpuriftar.github.io/';
function draw(i,q,t){const x=qrcode(0,'M');x.addData(i.value.trim());x.make();document.getElementById(q).innerHTML=x.createSvgTag({cellSize:8,margin:0,scalable:true});document.getElementById(t).textContent=i.value.trim()}
function go(){draw(u,'q','t');draw(u2,'q2','t2');p2.style.display=c2.checked?'':'none'}
document.getElementById('g').onclick=go;c2.onchange=go;go()</script></body></html>
